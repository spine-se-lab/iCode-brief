[project]
name = "compass-brief"
version = "0.2.40"
description = "Claim Layer: evidence-graded Claims, Requirement coverage and Goal maintenance for long Chrys sessions."
requires-python = ">=3.14"
# ``chrys`` is not on PyPI; the CodeHelix installer adds this package to the
# target Chrys project itself, where ``chrys`` is already the root project.
dependencies = []

# Discovered by the Chrys host seam (``chrys.service.features``).
[project.entry-points."chrys.features"]
compass_brief = "compass_brief.chrys.feature:feature_definition"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/compass_brief"]

[tool.pytest.ini_options]
# The Claim store commits under a lock, so its tests are async.
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "tests"]
# ``importlib`` import mode keeps two installed capability packages from
# colliding when both are collected in one run: their boundary tests may
# legitimately share a basename, and the default mode keys on that.
addopts = "--strict-markers --import-mode=importlib"

[tool.ruff]
target-version = "py314"
line-length = 120
src = ["src", "tests"]
fix = true

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF", "ASYNC", "S", "ISC", "RET", "C4", "PIE", "PERF", "T20", "FURB", "DTZ", "PLW", "TID"]
ignore = ["E501", "RET504", "S101", "S104", "S105", "S108", "S110", "ASYNC109", "ASYNC240", "PLW0603", "PLW2901"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PERF401"]

[tool.ruff.lint.isort]
known-first-party = ["compass_brief"]
